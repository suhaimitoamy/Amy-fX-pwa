name: Sync Amy FX Preview parity assets

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/sync-amyfx-main.yml
      - scripts/sync-from-amyfx-main.mjs
      - scripts/normalize-amyfx-export.mjs
      - scripts/validate-amyfx-sync.mjs
      - pwa-live-price-bridge.js
      - package.json

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: amyfx-pwa-preview-parity-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sync-preview-parity-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
      AMYFX_SOURCE_BRANCH: personal/amyfx-private

    steps:
      - name: Checkout PWA migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          path: pwa

      - name: Checkout Amy FX Preview source
        uses: actions/checkout@v4
        with:
          repository: suhaimitoamy/Amy-fx
          ref: personal/amyfx-private
          fetch-depth: 1
          path: amyfx-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record Amy FX Preview source revision
        shell: bash
        run: echo "AMYFX_SOURCE_SHA=$(git -C amyfx-source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Synchronize Preview-parity web assets
        working-directory: pwa
        run: npm run sync:amyfx-main

      - name: Normalize synchronized text
        working-directory: pwa
        run: node scripts/normalize-amyfx-export.mjs assets/apps

      - name: Validate PWA platform safeguards
        working-directory: pwa
        run: npm test

      - name: Validate Amy FX Preview engine parity
        working-directory: pwa
        run: npm run test:sync

      - name: Check generated diff
        working-directory: pwa
        run: git diff --check

      - name: Commit synchronized assets
        working-directory: pwa
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Amy FX PWA is already synchronized with Preview."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "sync: align PWA engine with Amy FX Preview ${AMYFX_SOURCE_SHA:0:12}"
          git fetch origin "${TARGET_BRANCH}"
          git rebase "origin/${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
